name: PSScriptAnalyzer

on:
  push:
    branches: [main]
    paths:
      - 'Module/**'
      - 'Tests/**'
      - 'Register-IntuneAssignmentCheckerApp.ps1'
      - '.PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/psscriptanalyzer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Module/**'
      - 'Tests/**'
      - 'Register-IntuneAssignmentCheckerApp.ps1'
      - '.PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/psscriptanalyzer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          Get-Module PSScriptAnalyzer | Format-List Name, Version

      - name: Run PSScriptAnalyzer
        id: analysis
        shell: pwsh
        run: |
          $files = @(
              Get-ChildItem ./Module/IntuneAssignmentChecker -Recurse -File -Include *.ps1, *.psm1
              Get-ChildItem ./Tests -Recurse -File -Include *.ps1
              Get-Item ./Register-IntuneAssignmentCheckerApp.ps1
          ) | Sort-Object FullName
          $results = @(
              foreach ($file in $files) {
                  Invoke-ScriptAnalyzer -Path $file.FullName `
                      -Settings ./.PSScriptAnalyzerSettings.psd1 -ErrorAction Stop
              }
          )
          $analysisErrors = @($results | Where-Object Severity -eq Error)
          $parseErrors = @($results | Where-Object Severity -eq ParseError)
          $errors = @($analysisErrors) + @($parseErrors)
          $warnings = @($results | Where-Object Severity -eq Warning)
          $information = @($results | Where-Object Severity -eq Information)

          ConvertTo-Json -InputObject @($results) -Depth 5 |
              Set-Content -LiteralPath analysis-results.json -Encoding utf8
          "error_count=$($errors.Count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "warning_count=$($warnings.Count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "info_count=$($information.Count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $report = @(
              '# PSScriptAnalyzer Report'
              ''
              "Analyzed $($files.Count) PowerShell source files."
              ''
              '| Severity | Count |'
              '|---|---:|'
              "| Error | $($analysisErrors.Count) |"
              "| ParseError | $($parseErrors.Count) |"
              "| Warning | $($warnings.Count) |"
              "| Information | $($information.Count) |"
          )
          if ($results.Count -gt 0) {
              $report += @('', '## Findings', '')
              foreach ($result in $results) {
                  $relativePath = [System.IO.Path]::GetRelativePath($PWD.Path, $result.ScriptPath)
                  $message = "$($result.Message)" -replace '[\r\n]+', ' '
                  $report += "- **$($result.Severity)** ``$($relativePath):$($result.Line)`` [$($result.RuleName)] $message"
              }
          }
          $report | Set-Content -LiteralPath analysis-report.md -Encoding utf8
          $report | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $results | Format-Table Severity, RuleName, ScriptName, Line, Message -Wrap

          if ($errors.Count -gt 0) {
              throw "PSScriptAnalyzer found $($errors.Count) error(s)."
          }

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psscriptanalyzer-results
          path: |
            analysis-results.json
            analysis-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on pull request
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ERROR_COUNT: ${{ steps.analysis.outputs.error_count }}
          WARNING_COUNT: ${{ steps.analysis.outputs.warning_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const errorCount = process.env.ERROR_COUNT || 'unknown';
            const warningCount = process.env.WARNING_COUNT || 'unknown';
            const marker = '<!-- intune-assignment-checker-psscriptanalyzer -->';
            const body = `${marker}\n## PSScriptAnalyzer Results\n\nErrors: **${errorCount}** · Warnings: **${warningCount}**\n\n[Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
